<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="RushConnect Consultoria - Especialistas em desenvolvimento sob demanda, arquitetura de soluções e transformação digital. Projetos de software que transformam seu negócio.">
    <meta name="keywords" content="consultoria TI, desenvolvimento de software, arquitetura de soluções, consultoria técnica, projetos sob demanda, Trindade Goiás">
    <meta name="author" content="RushConnect Consultoria">
    <meta name="robots" content="index, follow">
    <title>RushConnect Consultoria | Projetos de Software e Consultoria Técnica</title>
    
    <!-- Open Graph / Social Media -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="RushConnect Consultoria | Projetos de Software e Consultoria Técnica">
    <meta property="og:description" content="Especialistas em desenvolvimento sob demanda, arquitetura de soluções e transformação digital.">
    <meta property="og:locale" content="pt_BR">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Poppins:wght@500;600;700&family=Open+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Estilos -->
    <link rel="stylesheet" href="style.css">

    <!-- Site Data -->
    <script src="data.js"></script>
</head>
<body>
    <!-- ==================== HEADER ==================== -->
    <header id="header" class="header">
        <div class="header-container">
            <a href="#" class="logo" aria-label="RushConnect Consultoria - Ir para página inicial">
                <i class="fas fa-code"></i>
                <span id="logoText">RushConnect</span>
            </a>
            
            <!-- Menu Hamburger (mobile) -->
            <button class="menu-toggle" id="menuToggle" aria-label="Abrir menu de navegação">
                <span></span>
                <span></span>
                <span></span>
            </button>
            
            <!-- Menu Principal -->
            <nav class="nav-menu" id="navMenu" aria-label="Menu de navegação principal">
                <a href="#sobre" class="nav-link">Sobre</a>
                <a href="#servicos" class="nav-link">Serviços</a>
                <a href="#processos" class="nav-link">Processos</a>
                <a href="#depoimentos" class="nav-link">Depoimentos</a>
                <a href="#contato" class="nav-link">Contato</a>
            </nav>
            
            <!-- Informações de Contato -->
            <div class="header-contact">
                <a id="headerEmail" href="mailto:contato@rushconnect.com.br" class="contact-link" aria-label="Enviar e-mail para contato">
                    <i class="fas fa-envelope"></i>
                </a>
                <a id="headerPhone" href="tel:+5562999999999" class="contact-link" aria-label="Ligar para RushConnect">
                    <i class="fas fa-phone"></i>
                </a>
            </div>
        </div>
    </header>

    <!-- ==================== MAIN ==================== -->
    <main>
        <!-- ========== HERO SECTION ========== -->
        <section id="hero" class="hero" aria-labelledby="heroTitle">
            <div class="hero-content">
                <h1 class="hero-title" id="heroTitle"></h1>
                <p class="hero-subtitle"></p>
                
                <div class="hero-buttons" id="heroButtons">
                    <!-- Injetado dinamicamente -->
                </div>
            </div>
            <div class="hero-background">
                <div class="gradient-shape gradient-1"></div>
                <div class="gradient-shape gradient-2"></div>
                <div class="gradient-shape gradient-3"></div>
            </div>
        </section>

        <!-- ========== SEÇÃO SOBRE ========== -->
        <section id="sobre" class="about" aria-labelledby="aboutTitle">
            <div class="container">
                <div class="section-header">
                    <h2 id="aboutTitle"></h2>
                    <p id="aboutSubtitle"></p>
                </div>

                <div class="about-content">
                    <article class="about-text" id="aboutText">
                        <!-- Injetado dinamicamente -->
                    </article>

                    <div class="values-grid" id="valuesGrid">
                        <!-- Injetado dinamicamente -->
                    </div>
                </div>
            </div>
        </section>

        <!-- ========== SEÇÃO DE SERVIÇOS ========== -->
        <section id="servicos" class="services" aria-labelledby="servicesTitle">
            <div class="container">
                <div class="section-header">
                    <h2 id="servicesTitle"></h2>
                    <p id="servicesSubtitle"></p>
                </div>

                <div class="services-grid" id="servicesGrid">
                    <!-- Injetado dinamicamente -->
                </div>
            </div>
        </section>

        <!-- ========== SEÇÃO DE PROCESSOS ========== -->
        <section id="processos" class="processes" aria-labelledby="processesTitle">
            <div class="container">
                <div class="section-header">
                    <h2 id="processesTitle"></h2>
                    <p id="processesSubtitle"></p>
                </div>

                <div class="timeline" id="timelineContainer">
                    <!-- Injetado dinamicamente -->
                </div>
            </div>
        </section>

        <!-- ========== SEÇÃO DE DEPOIMENTOS ========== -->
        <section id="depoimentos" class="testimonials" aria-labelledby="testimonialsTitle">
            <div class="container">
                <div class="section-header">
                    <h2 id="testimonialsTitle"></h2>
                    <p id="testimonialsSubtitle"></p>
                </div>

                <div class="testimonials-grid" id="testimonialsGrid">
                    <!-- Injetado dinamicamente -->
                </div>

                <!-- Métricas de Sucesso -->
                <div class="success-metrics" id="metricsContainer">
                    <!-- Injetado dinamicamente -->
                </div>
            </div>
        </section>

        <!-- ========== SEÇÃO CTA FINAL ========== -->
        <section id="contato" class="cta-final" aria-labelledby="ctaTitle">
            <div class="container">
                <div class="cta-content">
                    <h2 id="ctaTitle"></h2>
                    <p id="ctaDescription"></p>
                    
                    <div class="cta-buttons" id="ctaButtons">
                        <!-- Injetado dinamicamente -->
                    </div>

                    <div class="contact-info" id="contactInfo">
                        <!-- Injetado dinamicamente -->
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- ==================== FOOTER ==================== -->
    <footer id="footer" class="footer">
        <div class="container">
            <div class="footer-content">
                <div class="footer-section">
                    <h3 id="footerCompanyName"></h3>
                    <p id="footerCompanyDesc"></p>
                </div>

                <div class="footer-section">
                    <h4>Links Rápidos</h4>
                    <ul id="footerLinks">
                        <!-- Injetado dinamicamente -->
                    </ul>
                </div>

                <div class="footer-section">
                    <h4>Contato</h4>
                    <ul id="footerContact">
                        <!-- Injetado dinamicamente -->
                    </ul>
                </div>
            </div>

            <div class="footer-bottom">
                <p id="footerCopyright"></p>
                <p>Hospedado em <a href="https://pages.github.com/" target="_blank" rel="noopener noreferrer">GitHub Pages</a></p>
            </div>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="script.js"></script>

    <!-- Structured Data - JSON-LD -->
    <script type="application/ld+json" id="organizationSchema">
        {
            "@context": "https://schema.org",
            "@type": "Organization",
            "name": "RushConnect Consultoria",
            "url": "https://rushconnect.com.br",
            "logo": "https://rushconnect.com.br/logo.png",
            "description": "Consultoria especializada em projetos de software sob demanda, arquitetura de soluções e transformação digital.",
            "areaServed": "BR",
            "contactPoint": {
                "@type": "ContactPoint",
                "telephone": "+5562999999999",
                "contactType": "Sales"
            },
            "address": {
                "@type": "PostalAddress",
                "streetAddress": "Trindade",
                "addressLocality": "Trindade",
                "addressRegion": "GO",
                "postalCode": "",
                "addressCountry": "BR"
            }
        }
    </script>
</body>
</html>
